name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # next build performs the TypeScript check; a bare tsc lacks the
      # generated LayoutProps/PageProps globals from .next/types.
      - run: npm run build
