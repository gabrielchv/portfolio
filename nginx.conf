# Cloud Run terminates TLS and injects PORT=8080; nginx sees plain HTTP.
# The www -> apex redirect keys off the Host header.

server {
    listen 8080;
    server_name www.gazerah.com;
    return 301 https://gazerah.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 512;

    location = / {
        return 301 /en/;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /resume/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
